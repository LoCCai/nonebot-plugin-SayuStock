name: NoneBot2 branch

on:
  push:
    branches: [nonebot2]
  pull_request:
    paths:
      - "nonebot_plugin_sayustock/**"
      - "tests_nb2/**"
      - "pyproject.toml"
      - "SayuStock/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check nonebot_plugin_sayustock tests_nb2
      - name: Test
        run: pytest tests_nb2 -q