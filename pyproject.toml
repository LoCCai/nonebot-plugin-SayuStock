[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-sayustock"
version = "0.9.0"
description = "SayuStock for NoneBot2: A股行情、K线、板块、技术分析、PicMenu Next、MoEllmChats 工具与 QWeb 网页 AI 基座"
authors = [
  { name = "LoCCai" },
  { name = "KimigaiiWuyi", email = "444835641@qq.com" },
]
dependencies = [
  "nonebot2>=2.3.0",
  "nonebot-adapter-onebot>=2.4.0",
  "fastapi>=0.100",
  "httpx>=0.27",
  "jinja2>=3.1.6,<4",
  "pandas>=2.2.3",
  "numpy>=1.26",
  "pillow>=10",
  "aiohttp>=3.9",
  "aiofiles>=23",
  "markupsafe>=2.1",
  "markdown>=3.5",
  "holidays>=0.50",
]
requires-python = ">=3.10,<4"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }

[project.optional-dependencies]
render = ["nonebot-plugin-htmlrender>=0.6.7", "playwright>=1.49.0"]
qq = ["nonebot-adapter-qq>=1.4.0"]
localstore = ["nonebot-plugin-localstore>=0.7.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "nonebot-adapter-qq>=1.4.0"]

[project.urls]
Homepage = "https://github.com/LoCCai/nonebot-plugin-SayuStock"
Repository = "https://github.com/LoCCai/nonebot-plugin-SayuStock"
"Upstream GsCore" = "https://github.com/KimigaiiWuyi/SayuStock"

[tool.nonebot]
plugins = ["nonebot_plugin_sayustock"]
adapters = [
  { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" },
  { name = "OneBot V12", module_name = "nonebot.adapters.onebot.v12" },
]
driver = "~fastapi"

[tool.setuptools.packages.find]
where = ["."]
include = ["nonebot_plugin_sayustock*", "SayuStock*"]
exclude = ["test*", "tests*", "docs*", "doc*", "plans*"]

[tool.setuptools.package-data]
nonebot_plugin_sayustock = ["web/templates/*", "web/static/*"]
SayuStock = ["render/templates/*", "stock_info/texture2d/*", "utils/texture2d/*", "skills/**/*.md", "**/*.json"]

[tool.poetry]
name = "SayuStock"
version = "0.6"
description = "基于GsCore, 支持OneBot(QQ)、OneBotV12、QQ频道、微信、KOOK（开黑啦）、Telegram（电报）、FeiShu（飞书）、DoDo、Discord的全功能HoshinoBot/NoneBot2/Koishi/yunzai/ZeroBot股票/A股机器人插件（大盘云图等）"
authors = ["KimigaiiWuyi <444835641@qq.com>"]
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://github.com/KimigaiiWuyi/SayuStock"
repository = "https://github.com/KimigaiiWuyi/SayuStock"
documentation = "https://docs.sayu-bot.com/"
packages = [{ include = "SayuStock" }]
exclude = ["tests", "deploy"]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/KimigaiiWuyi/SayuStock/issues"

[tool.pdm]
distribution = false

# basedpyright 与 pyright 共用 [tool.pyright]；二者不能同时出现 tool.basedpyright
[tool.pyright]
include = ["SayuStock"]
# Kronos 是 vendored 的第三方 submodule，不检查它自己的代码
exclude = ["**/__pycache__", "SayuStock/Kronos"]
extraPaths = [
  "../../../",
  "../../../gsuid_core",
  "../../../gsuid_core/ai_core",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportMissingModuleSource = false
disableBytesTypePromotions = false

# 锚定 rootdir 到本插件，避免向上找到 gsuid_core 的 [tool.pytest.ini_options]
# 把插件根放进 pythonpath，使 `import SayuStock` 在 market 等未手写 sys.path 的测试中可用
[tool.pytest.ini_options]
testpaths = ["test"]
# "." → import SayuStock；"test" → import kline_fixtures 等测试辅助模块
pythonpath = [".", "test"]
asyncio_default_fixture_loop_scope = "function"

# 本仓库以 ruff.toml 为准；此处只排除非 Python 文件，避免扩展把 TOML 当 .py 查
[tool.ruff]
extend = "ruff.toml"
exclude = [
  "pyproject.toml",
  "*.toml",
  "*.lock",
  "*.md",
]
